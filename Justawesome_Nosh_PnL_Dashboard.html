<title>Justawesome Nosh — P&amp;L Dashboard</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F4F6F8;color:#12212B;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate{background:#fff;border:1px solid #E1E7EB;border-radius:14px;box-shadow:0 6px 24px rgba(18,33,43,.08);padding:34px 32px 28px;width:100%;max-width:380px;text-align:center}
  .lock{width:46px;height:46px;border-radius:50%;background:#12212B;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  h1{font-size:18px;margin:0 0 4px;font-weight:700}
  p.sub{font-size:13px;color:#5B6B76;margin:0 0 20px}
  .field{position:relative}
  input{width:100%;font-size:15px;padding:11px 44px 11px 12px;border:1px solid #C9D3D9;border-radius:9px;outline:none}
  input:focus{border-color:#12212B;box-shadow:0 0 0 3px rgba(18,33,43,.12)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px 8px;cursor:pointer;color:#5B6B76;font-size:12px}
  button.go{width:100%;margin-top:14px;padding:11px;border:0;border-radius:9px;background:#12212B;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button.go:disabled{opacity:.6;cursor:wait}
  .err{min-height:18px;margin-top:12px;font-size:13px;color:#C4432B}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

  var SKEY = 'nosh_dash_session_key';

  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  async function deriveKey(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
  }
  async function decrypt(key){
    var buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.iv) }, key, b64(P.data));
    return new TextDecoder().decode(buf);
  }
  function show(html){
    var f = document.createElement('iframe');
    f.srcdoc = html;
    f.title = 'Justawesome Nosh — P&L Dashboard';
    f.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#F4F6F8';
    document.body.style.cssText = 'display:block;padding:0;background:#F4F6F8';
    document.body.innerHTML = '';
    document.body.appendChild(f);
  }

  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');

  if (!(window.crypto && crypto.subtle)){
    err.textContent = 'This page needs a secure (https) connection to unlock.';
    go.disabled = true;
    return;
  }

  document.getElementById('eye').addEventListener('click', function(){
    var hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? 'Hide' : 'Show';
  });

  // Stay unlocked across refreshes in this tab only (cleared when the tab is closed).
  (async function(){
    try {
      var saved = sessionStorage.getItem(SKEY);
      if (!saved) return;
      var key = await crypto.subtle.importKey('jwk', JSON.parse(saved), { name:'AES-GCM' }, false, ['decrypt']);
      show(await decrypt(key));
    } catch (e) { try { sessionStorage.removeItem(SKEY); } catch (_) {} }
  })();

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    if (!pw.value) { err.textContent = 'Please enter the password.'; return; }
    go.disabled = true; go.textContent = 'Unlocking…'; err.textContent = '';
    try {
      var key = await deriveKey(pw.value);
      var html = await decrypt(key);            // throws if the password is wrong
      try { sessionStorage.setItem(SKEY, JSON.stringify(await crypto.subtle.exportKey('jwk', key))); } catch (_) {}
      show(html);
    } catch (e) {
      err.textContent = 'Incorrect password. Please try again.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select();
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
